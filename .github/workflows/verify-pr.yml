name: Verify pull request
on:
  pull_request:
    branches:
      - "main*"

jobs:
    test:
      name: test
      runs-on: ubuntu-latest
      steps:
       - uses: actions/checkout@v3
       - uses: actions/setup-node@v3
         with:
           node-version: '18'
           cache: 'npm'

       - name: "Config npm"
         id: config-npm
         run: |
           npm set @gu-corp:registry=https://npm.pkg.github.com
           npm set //npm.pkg.github.com/:_authToken=${{ secrets.READ_NPM_PACKAGES_TOKEN }}
       - run: npm ci --legacy-peer-deps
       - run: npm run lint
       - run: npm run test

    build-android:
      name: Build android
      runs-on: ubuntu-latest
      needs: test

      steps:
        - name: Set up JDK 17
          uses: actions/setup-java@v3
          with:
            java-version: '17'
            distribution: 'temurin'

        - run: npm run install-ci
        - run: npm run build:android


    build-ios:
      name: Build IOS
      runs-on: macos-13
      needs: test
      env:
        DEVELOPER_DIR: /Applications/Xcode_15.2.app

      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-node@v3
          with:
            node-version: '18'
            cache: 'npm'
        - uses: actions/cache@v3
          with:
            path: ios/Pods
            key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
            restore-keys: |
              ${{ runner.os }}-pods-
        - run: npm run install-ci
        - run: npm run setup-ios
        - run: npm run build:ios
